PlayerAegisPulse:
  Cooldown: 28
  Skills:
  - potion{type=DAMAGE_RESISTANCE;lvl=1;duration=120} @self
  - potion{type=ABSORPTION;lvl=2;duration=160} @self
  - potion{type=REGENERATION;lvl=1;duration=80} @self
  - effect:sound{s=item.shield.block;volume=1.0;pitch=0.7} @self
  - effect:particles{p=totem;amount=90;hSpread=2;ySpread=1;speed=0.02} @self

PlayerCinderStep:
  Cooldown: 22
  Skills:
  - potion{type=SPEED;lvl=2;duration=100} @self
  - potion{type=FIRE_RESISTANCE;lvl=1;duration=180} @self
  - ignite{ticks=80} @MobsInRadius{r=5}
  - damage{amount=5;ignorearmor=false} @MobsInRadius{r=5}
  - effect:sound{s=entity.blaze.shoot;volume=0.8;pitch=1.2} @self
  - effect:particles{p=flame;amount=120;hSpread=3;ySpread=1;speed=0.05} @self

PlayerGraveHook:
  Cooldown: 18
  Skills:
