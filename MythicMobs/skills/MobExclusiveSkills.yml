MobPackHowl:
  Cooldown: 14
  Skills:
  - potion{type=SPEED;lvl=1;duration=100} @MobsInRadius{r=12;t=WildFeralZombie,WildGraveSkeleton,WildVenomSpider,MossboundHusk,MoonlitStray,BurrowSpider}
  - potion{type=INCREASE_DAMAGE;lvl=1;duration=80} @MobsInRadius{r=12;t=WildFeralZombie,WildGraveSkeleton,WildVenomSpider,MossboundHusk,MoonlitStray,BurrowSpider}
  - effect:sound{s=entity.wolf.howl;volume=0.8;pitch=0.65} @self
  - effect:particles{p=angryVillager;amount=60;hSpread=4;ySpread=1;speed=0} @self

MobArmorShred:
  Cooldown: 6
  Skills:
  - damage{amount=5;ignorearmor=true} @target
  - potion{type=WEAKNESS;lvl=2;duration=80} @target
  - potion{type=SLOW_DIGGING;lvl=1;duration=100} @target
  - effect:particles{p=crit;amount=70;hSpread=1;ySpread=1;speed=0.08} @target

MobGrudgeBarrier:
  Cooldown: 18
  Skills:
  - potion{type=DAMAGE_RESISTANCE;lvl=2;duration=100} @self
  - heal{amount=10} @self
  - effect:sound{s=item.shield.block;volume=0.8;pitch=0.6} @self
  - effect:particles{p=enchanted_hit;amount=80;hSpread=2;ySpread=1;speed=0.02} @self

MobDoomMark:
  Cooldown: 9
  Skills:
  - potion{type=GLOWING;lvl=1;duration=120} @target
  - potion{type=DARKNESS;lvl=1;duration=70} @target
  - damage{amount=6;ignorearmor=true} @target
  - effect:sound{s=entity.evoker.prepare_attack;volume=0.8;pitch=0.7} @self
  - effect:particles{p=witch;amount=90;hSpread=2;ySpread=1;speed=0.02} @target

MobCullTheWeak:
  Cooldown: 12
  Skills:
  - damage{amount=10;ignorearmor=true} @target
  - potion{type=SLOW;lvl=3;duration=60} @target
  - potion{type=HUNGER;lvl=2;duration=120} @target
  - effect:sound{s=entity.player.attack.crit;volume=1.0;pitch=0.55} @self

MobRiftSnare:
  Cooldown: 11
  Skills:
  - potion{type=SLOW;lvl=3;duration=80} @PlayersInRadius{r=7}
  - potion{type=WEAKNESS;lvl=1;duration=80} @PlayersInRadius{r=7}
  - damage{amount=5;ignorearmor=true} @PlayersInRadius{r=7}
  - effect:sound{s=entity.enderman.teleport;volume=0.9;pitch=0.6} @self
  - effect:particles{p=portal;amount=160;hSpread=5;ySpread=2;speed=0.06} @self
